[package]
name = "libaw-proof"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish = false
description = "The referee program a zkVM proves: check and apply a list of actions, report the result."

[features]
# Off for zkVM guests without std (Nexus, Airbender).
default = ["std"]
std = ["libaw/std", "serde/std", "serde_json/std"]

[dependencies]
libaw = { path = "../../../libaw/crates/engine", default-features = false }
serde = { version = "1", default-features = false, features = ["derive", "alloc"] }
serde_json = { version = "1", default-features = false, features = ["alloc"] }

[[bin]]
name = "proof-workloads"
required-features = ["std"]
