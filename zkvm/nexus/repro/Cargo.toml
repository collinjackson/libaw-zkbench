[package]
name = "nexus-hashmap-repro"
version = "0.1.0"
edition = "2021"

[workspace]

[dependencies]
nexus-rt = { git = "https://github.com/nexus-xyz/nexus-zkvm", tag = "v0.3.6" }
hashbrown = { version = "0.15", default-features = false, features = ["default-hasher"] }
libaw = { path = "../../../../libaw/crates/engine", default-features = false }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
