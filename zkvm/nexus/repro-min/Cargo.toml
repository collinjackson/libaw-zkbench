[package]
name = "nexus-repro-min"
version = "0.1.0"
edition = "2021"

[workspace]

[dependencies]
nexus-rt = { git = "https://github.com/nexus-xyz/nexus-zkvm", tag = "v0.3.6" }
hashbrown = { version = "0.15", default-features = false, features = ["serde"] }

serde = { version = "1", default-features = false, features = ["derive", "alloc"] }
serde_json = { version = "1", default-features = false, features = ["alloc"] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
