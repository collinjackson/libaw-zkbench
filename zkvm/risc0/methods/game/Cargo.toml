[package]
name = "game"
version = "0.1.0"
edition = "2021"

[workspace]

[dependencies]
risc0-zkvm = { version = "~3.0.6", default-features = false, features = ["std"] }
libaw-turn = { path = "../../../../crates/turn" }
serde_json = "1"

[profile.release]
opt-level = 3
lto = true

# arena-abi (libaw-arena) names libaw by its git URL; build it against the same local libaw.
[patch."https://github.com/collinjackson/libaw"]
libaw = { path = "../../../../../libaw/crates/engine" }
