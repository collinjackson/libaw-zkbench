# RISC Zero runner for the zkVM benchmark (README.md). Its own workspace, so libaw's
# build never pulls in zkVM crates.
[workspace]
resolver = "2"
members = ["host", "methods"]

[profile.release]
opt-level = 3

# arena-abi (libaw-arena) names libaw by its git URL; build it against the same local libaw.
[patch."https://github.com/collinjackson/libaw"]
libaw = { path = "../../../libaw/crates/engine" }
